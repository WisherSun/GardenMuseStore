<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icon: green tea leaves (public/icons/), free icon from Flaticon:
         https://www.flaticon.com/free-icon/green-tea_6692378 (free licence asks for a credit) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png" />
    <!-- iPhone / iPad "Add to Home Screen" icon (on cream, as iOS shows transparent parts as black) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Garden Muse — artisanal floral design atelier & botanical studio. Bouquets, living plants and seasonal stems delivered same-day in London & NYC." />
    <meta name="theme-color" content="#fcf9f4" />
    <title>Garden Muse — Floral Atelier</title>

    <!-- Start downloading the hero photo right away (same sizes as in src/pages/Home/Hero.jsx) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      imagesrcset="/hero/hero-640.webp 640w, /hero/hero-960.webp 960w, /hero/hero-1400.webp 1400w, /hero/hero-2000.webp 2000w"
      imagesizes="(min-width: 1280px) 1790px, 145vw"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify Forms looks for forms in the built HTML, but React draws ours later in the browser.
         This hidden copy tells Netlify the form name and fields (keep in sync with src/pages/Bespoke/BespokePage.jsx). -->
    <form name="bespoke" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="occasion" />
      <input name="date" />
      <input name="budget" />
      <textarea name="wishes"></textarea>
    </form>
    <!-- Same for the FAQ question form on the home page (keep in sync with src/pages/Home/Faq.jsx) -->
    <form name="question" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <textarea name="question"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
