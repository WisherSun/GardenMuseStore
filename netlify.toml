# Netlify settings (read automatically when the site is deployed from GitHub)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# The site is one page (index.html) and React Router shows the right screen.
# Without this, opening or refreshing /shop, /cart, /account... gives "Page not found".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built JS/CSS files have a unique name per version, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
